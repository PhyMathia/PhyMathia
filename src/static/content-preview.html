<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhyMathia 内容预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    /* 底色与 _buildContentPreviewPage 的极光纱底同源（graph-custom.js），加载闪帧/缺内容态不露旧色 */
    background: #0b1026; color: #cfd6f4;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #contentFrame { width: 100%; height: 100%; border: 0; display: block; flex: 1; }
  #hint {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #8b93b8; font-size: 14px; padding: 24px; text-align: center;
  }
</style>
</head>
<body>
<iframe id="contentFrame" sandbox="allow-scripts"></iframe>
<div id="hint">未找到内容，请回到应用内重新点击「新窗口全屏」。</div>
<script>
// 与 viz-preview.html 同一安全模型：本页是可信的同源页面；画布节点的渲染产物
// （主应用渲染管线已 sanitize 的 markdown/公式/mermaid 静态 HTML，经 sessionStorage
// 交接）只进入 sandbox iframe 展示，不与本页 origin 交互。
// 注意勿退回 Blob URL 直开：Blob 文档继承主站 origin（viz-preview.md 同款结论）。
try {
  var page = sessionStorage.getItem('phymathia_content_preview');
  sessionStorage.removeItem('phymathia_content_preview');
  if (page) {
    document.getElementById('contentFrame').srcdoc = page;
    document.getElementById('hint').style.display = 'none';
  } else {
    document.getElementById('contentFrame').style.display = 'none';
  }
} catch (e) {
  document.getElementById('contentFrame').style.display = 'none';
}
// 划词快捷工具桥（2026-10-25，node-fs-toolbar.js 方案）：沙箱 iframe 里的浮条不直接
// 干活，动作消息经本页转发给 window.opener（主应用），ack 原路带回。本页仍不执行任何
// 业务逻辑——只做带 source 校验的信差：只认自家 contentFrame 发来的 node-fs-action，
// 只把 opener 回的 node-fs-ack 传进 iframe；800ms 没等到 ack 就合成失败应答
// （主应用未响应）。token / 动作白名单 / 会话归属由主应用侧校验，本页不碰。
window.addEventListener('message', function (ev) {
  var frame = document.getElementById('contentFrame');
  if (!frame || ev.source !== frame.contentWindow) return;
  var d = ev.data;
  if (!d || d.__phymathia !== 1 || d.kind !== 'node-fs-action') return;
  var ackIntoFrame = function (payload) {
    try { frame.contentWindow.postMessage(payload, '*'); } catch (e2) { /* 沙箱侧无从投递 */ }
  };
  var fail = function (msg) {
    ackIntoFrame({ kind: 'node-fs-ack', __phymathia: 1, token: d.token, ok: false, message: msg });
  };
  if (!window.opener || window.opener.closed) {
    fail('主应用未响应，当前只能复制');
    return;
  }
  var settled = false;
  var onAck = function (aev) {
    if (aev.source !== window.opener) return;
    var ad = aev.data;
    if (!ad || ad.__phymathia !== 1 || ad.kind !== 'node-fs-ack') return;
    settled = true;
    window.removeEventListener('message', onAck);
    ackIntoFrame(ad);
  };
  window.addEventListener('message', onAck);
  try {
    window.opener.postMessage(d, location.origin);
  } catch (e) {
    settled = true;
    window.removeEventListener('message', onAck);
    fail('转发失败');
    return;
  }
  setTimeout(function () {
    if (settled) return;
    window.removeEventListener('message', onAck);
    fail('主应用未响应，当前只能复制');
  }, 800);
});
</script>
</body>
</html>

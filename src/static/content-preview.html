<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhyMathia 内容预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  :root { --cp-shell-bg: #080d20; --cp-shell-ink: #c6cfe8; --cp-shell-mute: #8b93b8; }
  html[data-theme="light"] { --cp-shell-bg: #f8f3ea; --cp-shell-ink: #4a4133; --cp-shell-mute: #7d6f59; }
  body {
    display: flex; flex-direction: column;
    /* 底色与 _buildContentPreviewPage 的极光纱底同源（graph-custom.js），加载闪帧/缺内容态不露旧色；
       浅色主题靠主应用写进 sessionStorage 的 theme 键先在首帧换色（见下） */
    background: var(--cp-shell-bg); color: var(--cp-shell-ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  #contentFrame { width: 100%; height: 100%; border: 0; display: block; flex: 1; }
  #hint {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--cp-shell-mute); font-size: 14px; padding: 24px; text-align: center;
  }
</style>
</head>
<body>
<iframe id="contentFrame" sandbox="allow-scripts"></iframe>
<div id="hint">未找到内容，请回到应用内重新点击「新窗口全屏」。</div>
<script>
// 与 viz-preview.html 同一安全模型：本页是可信的同源页面；画布节点的渲染产物
// （主应用渲染管线已 sanitize 的 markdown/公式/mermaid 静态 HTML，经 sessionStorage
// 交接）只进入 sandbox iframe 展示，不与本页 origin 交互。
// 注意勿退回 Blob URL 直开：Blob 文档继承主站 origin（viz-preview.md 同款结论）。
try {
  // 交接键按 token 分键（486 串窗）：静态单键在「快速连开两扇」时会被后开的覆盖，
  // 先开的标签页可能拿到后一份内容（跨标签 sessionStorage 复制时机各浏览器不一致，
  // utopia.js 有实测），页里烤着的 token/nodeId 跟着错。token 由主应用开窗时写在
  // URL 上（?t=），本页只认自己那一枚键。token 是主应用自造的 nfs_/cp_ 串，白名单
  // 过滤后再拼键，别让 location.search 里的东西直接进键名。
  var t = '';
  try { t = decodeURIComponent(String((location.search.match(/[?&]t=([^&]+)/) || [])[1] || '')); } catch (eT) { t = ''; }
  t = t.replace(/[^A-Za-z0-9_-]/g, '');
  // 首帧底色跟随主应用明暗（2026-11-14）：主应用开窗前把主题写进同域 sessionStorage，
  // 这里先换色再塞 srcdoc，浅色主题不会先闪一版深底
  if (t && sessionStorage.getItem('phymathia_content_preview_theme_' + t) === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  if (t) sessionStorage.removeItem('phymathia_content_preview_theme_' + t);
  var page = t ? sessionStorage.getItem('phymathia_content_preview_' + t) : '';
  if (t) sessionStorage.removeItem('phymathia_content_preview_' + t);
  if (page) {
    document.getElementById('contentFrame').srcdoc = page;
    document.getElementById('hint').style.display = 'none';
  } else {
    document.getElementById('contentFrame').style.display = 'none';
  }
} catch (e) {
  document.getElementById('contentFrame').style.display = 'none';
}
// 划词快捷工具桥（2026-10-25，node-fs-toolbar.js 方案）：沙箱 iframe 里的浮条不直接
// 干活，动作消息经本页转发给 window.opener（主应用），ack 原路带回。本页仍不执行任何
// 业务逻辑——只做带 source 校验的信差：只认自家 contentFrame 发来的 node-fs-action，
// 只把 opener 回的 node-fs-ack 传进 iframe；800ms 没等到 ack 就合成失败应答
// （主应用未响应）。token / 动作白名单 / 会话归属由主应用侧校验，本页不碰。
window.addEventListener('message', function (ev) {
  var frame = document.getElementById('contentFrame');
  if (!frame || ev.source !== frame.contentWindow) return;
  var d = ev.data;
  if (!d || d.__phymathia !== 1) return;
  // 阅读页自己的明暗开关（2026-11-14）：只落盘、不转发主应用。沙箱 iframe 是 opaque
  // origin 拿不到存储，而本页与主应用同源——键名与 config.js 的 STORAGE_KEY_READER_THEME
  // 一致（那边只读，改名要两边一起改）
  if (d.kind === 'cp-theme') {
    try {
      localStorage.setItem('phymathia_reader_theme', JSON.stringify({
        theme: d.theme === 'light' ? 'light' : 'dark',
        app: d.app === 'light' ? 'light' : 'dark'
      }));
    } catch (e0) { /* 存储被禁：仅本次有效 */ }
    return;
  }
  if (d.kind !== 'node-fs-action') return;
  var ackIntoFrame = function (payload) {
    try { frame.contentWindow.postMessage(payload, '*'); } catch (e2) { /* 沙箱侧无从投递 */ }
  };
  var fail = function (msg) {
    ackIntoFrame({ kind: 'node-fs-ack', __phymathia: 1, token: d.token, seq: d.seq, ok: false, message: msg });
  };
  if (!window.opener || window.opener.closed) {
    fail('主应用窗口已关闭，这个窗口只能复制');
    return;
  }
  var settled = false;
  var onAck = function (aev) {
    if (aev.source !== window.opener) return;
    var ad = aev.data;
    if (!ad || ad.__phymathia !== 1 || ad.kind !== 'node-fs-ack') return;
    // 只转发本动作的 ack：并发动作时第一枚 ack 不能把所有挂起转发一起了结（2026-11-18）
    if (typeof ad.seq === 'number' && ad.seq !== d.seq) return;
    settled = true;
    window.removeEventListener('message', onAck);
    ackIntoFrame(ad);
  };
  window.addEventListener('message', onAck);
  try {
    window.opener.postMessage(d, location.origin);
  } catch (e) {
    settled = true;
    window.removeEventListener('message', onAck);
    fail('转发失败');
    return;
  }
  // 兜底比 iframe 自己那枚（2500ms）晚一拍：正常情况下由它先说话，这里只防
  // 「沙箱页定时器被节流」的极端情形，别让同一件事弹两次。
  // 渲染态编辑（edit，2026-11-20）要等主应用重渲公式/mermaid/viz 再回成品，兜底放宽：
  // 外壳 11s（内嵌侧 10s），别让大页面的保存被合成失败应答截胡
  var tmo = d.action === 'edit' ? 11000 : 3200;
  setTimeout(function () {
    if (settled) return;
    window.removeEventListener('message', onAck);
    fail('主应用没回应，再点一次发送');
  }, tmo);
});
</script>
</body>
</html>

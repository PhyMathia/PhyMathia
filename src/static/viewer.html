<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utopia 查看器 · PhyMathia</title>
<script>
  // 查看器首屏主题：快照里带主题则在装载时覆盖（见 viewer-main.js）；这里只给个不刺眼的默认
  try {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('phymathia_theme') || 'dark');
    // 跟随分享者本机的风格家族（2026-10-02 用户拍板 Q13「查看器跟随」）：一个 key 同挂
    // 双属性，CSS 家族块在 styles.min.css/graph-override.min.css 里自动生效；缺家族键时
    // 从旧 phymathia_node_skin 折算，默认 aurora 不挂属性＝默认玻璃脸。
    var fam = localStorage.getItem('phymathia_style_family') || localStorage.getItem('phymathia_node_skin');
    if (fam && fam !== 'aurora' && /^[a-z0-9-]{1,32}$/.test(fam)) {
      document.documentElement.setAttribute('data-node-skin', fam);
      document.documentElement.setAttribute('data-panel-skin', fam);
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/css/styles.min.css">
<link rel="stylesheet" href="/css/styles-panels.min.css">
<link rel="stylesheet" href="/css/graph-override.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<script defer src="/vendor/marked/marked.min.js"></script>
<script defer src="/vendor/dompurify/purify.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg-dark, #0a0e1e); color: var(--text-primary, #e6ebf5); overflow: hidden; }
  .utopia-shell { display: flex; flex-direction: column; height: 100vh; position: relative; }
  /* 顶栏：极光玻璃浮条（背景交给 .aurora-glass，这里绝不再写 background 简写） */
  .utopia-bar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-radius: 18px; flex-wrap: wrap;
  }
  .utopia-brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; min-width: 0; }
  .utopia-brand b { font-size: 14px; letter-spacing: .3px; }
  .utopia-brand span { font-size: 12px; color: var(--text-secondary, #93a1bd); }
  .utopia-tag {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid color-mix(in srgb, var(--accent, #4a9eff) 34%, transparent);
    background: color-mix(in srgb, var(--accent, #4a9eff) 12%, transparent);
    color: var(--text-secondary, #93a1bd);
  }
  .utopia-btn {
    font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--border, rgba(255,255,255,.16)) 80%, transparent);
    background: color-mix(in srgb, var(--surface-container, rgba(255,255,255,.06)) 70%, transparent);
    color: var(--text-primary, #e6ebf5); transition: border-color .18s ease, transform .18s ease, background .18s ease;
  }
  .utopia-btn:hover { border-color: var(--accent, #4a9eff); transform: translateY(-1px); }
  .utopia-btn.primary {
    background: linear-gradient(135deg, var(--accent, #4a9eff), color-mix(in srgb, var(--accent, #4a9eff) 62%, #a78bfa));
    color: #06101f; border-color: transparent; font-weight: 600;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--accent, #4a9eff) 35%, transparent);
  }
  .utopia-error {
    margin: 10px 14px 0; padding: 10px 12px; border-radius: 10px; font-size: 13px;
    border: 1px solid #ef4444; background: rgba(239,68,68,.12); color: #ffd9d9;
  }
  .utopia-stage { position: relative; flex: 1 1 auto; min-height: 0; }
  .utopia-stage .graph-workspace { position: absolute; inset: 0; }
  .utopia-stage .graph-canvas { position: absolute; inset: 0; overflow: hidden; }
  .utopia-drop {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(560px, calc(100vw - 48px)); border-radius: 22px; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-align: center; padding: 28px 26px; pointer-events: none;
    box-shadow: 0 26px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .utopia-drop.hidden { display: none; }
  .utopia-drop.active { border-color: var(--accent, #4a9eff); box-shadow: 0 26px 70px rgba(0,0,0,.5), 0 0 0 1px var(--accent, #4a9eff) inset; }
  .utopia-drop h2 { margin: 0; font-size: 17px; }
  .utopia-drop p { margin: 0; font-size: 13px; color: var(--text-secondary, #93a1bd); line-height: 1.7; }
  .utopia-drop .utopia-btn { pointer-events: auto; }
  .utopia-toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
    border: 1px solid color-mix(in srgb, var(--accent, #4a9eff) 26%, var(--border));
    box-shadow: 0 14px 40px rgba(0,0,0,.34);
    transition: opacity .22s ease, transform .22s ease; z-index: 40; max-width: 86vw;
  }
  .utopia-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* 会话记录面板：右侧滑入的只读对话列表（快照携带完整会话时可用） */
  .utopia-msgs {
    position: absolute; top: 74px; right: 12px; bottom: 12px; z-index: 22;
    width: min(430px, calc(100vw - 24px));
    display: flex; flex-direction: column;
    border-radius: 18px;
    opacity: 0; pointer-events: none; transform: translateX(14px);
    transition: opacity .2s ease, transform .2s ease;
  }
  .utopia-msgs.open { opacity: 1; pointer-events: auto; transform: translateX(0); }
  .utopia-msgs-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px 10px; border-bottom: 1px solid var(--border, rgba(255,255,255,.12));
  }
  .utopia-msgs-head b { font-size: 14px; }
  .utopia-msgs-head .utopia-msgs-count { font-size: 12px; color: var(--text-secondary, #93a1bd); margin-right: auto; }
  .utopia-msgs-close {
    font: inherit; font-size: 16px; line-height: 1; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border, rgba(255,255,255,.16)); background: transparent; color: inherit;
  }
  .utopia-msgs-list { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .utopia-msg {
    border: 1px solid var(--border, rgba(255,255,255,.12));
    border-radius: 14px; padding: 10px 12px; background: color-mix(in srgb, var(--surface-container, rgba(255,255,255,.06)) 70%, transparent);
  }
  .utopia-msg-user { border-left: 3px solid var(--accent, #4a9eff); }
  .utopia-msg-ai { border-left: 3px solid #10b981; }
  .utopia-msg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .utopia-msg-role { font-size: 12px; font-weight: 700; }
  .utopia-msg-user .utopia-msg-role { color: var(--accent, #4a9eff); }
  .utopia-msg-ai .utopia-msg-role { color: #10b981; }
  .utopia-msg-branch {
    font-size: 10px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent, #4a9eff) 40%, transparent);
    color: var(--text-secondary, #93a1bd);
  }
  .utopia-msg-time { margin-left: auto; font-size: 11px; color: var(--text-secondary, #93a1bd); opacity: .8; }
  .utopia-msg-body { font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
  .utopia-msg-body :is(h1,h2,h3,h4) { font-size: 15px; margin: .5em 0 .3em; }
  .utopia-msg-body p { margin: .35em 0; }
  .utopia-msg-body pre { max-width: 100%; overflow-x: auto; font-size: 12px; }
  .utopia-msg-foot { margin-top: 6px; min-height: 22px; }
  .utopia-msg-locate {
    font: inherit; font-size: 12px; padding: 3px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--accent, #4a9eff) 45%, transparent);
    background: color-mix(in srgb, var(--accent, #4a9eff) 12%, transparent);
    color: var(--text-primary, #e6ebf5);
  }
  .utopia-msg-locate:hover { border-color: var(--accent, #4a9eff); }
</style>
</head>
<body>
<div class="utopia-shell">
  <div class="utopia-bar aurora-glass">
    <div class="utopia-brand">
      <b><span id="utopiaTitle">Utopia 查看器</span></b>
      <span id="utopiaMeta">PhyMath Utopia 快照（.pmu）· 只读 · 离线</span>
    </div>
    <span class="utopia-tag">只读</span>
    <button class="utopia-btn primary" id="utopiaOpenBtn">打开快照</button>
    <button class="utopia-btn" id="utopiaMsgsBtn" title="会话记录（完整对话，可定位到节点）">会话</button>
    <button class="utopia-btn" id="utopiaFitBtn" title="适配画布（F）">适配</button>
    <button class="utopia-btn" id="utopiaZoomInBtn" title="放大">＋</button>
    <button class="utopia-btn" id="utopiaZoomOutBtn" title="缩小">－</button>
    <button class="utopia-btn" id="utopiaSearchBtn" title="搜索节点（/）">搜索</button>
    <button class="utopia-btn" id="utopiaThemeBtn" title="切换深色/浅色（仅本次查看，不改快照）">主题</button>
    <button class="utopia-btn" id="utopiaExpandBtn" title="展开所有折叠节点（仅本次查看，不写回）">展开全部</button>
    <button class="utopia-btn" id="utopiaPngBtn" title="导出 PNG（含完整内容选项）">导出 PNG</button>
    <input type="file" id="utopiaFile" accept=".pmu,.json,application/json" hidden>
  </div>
  <div class="utopia-error" id="utopiaError" hidden></div>
  <div class="utopia-stage">
    <div class="utopia-msgs aurora-glass" id="utopiaMsgsPanel">
      <div class="utopia-msgs-head">
        <b>会话记录</b>
        <span class="utopia-msgs-count" id="utopiaMsgsCount"></span>
        <button class="utopia-msgs-close" id="utopiaMsgsClose" title="关闭（Esc）">&times;</button>
      </div>
      <div class="utopia-msgs-list" id="utopiaMsgsList"></div>
    </div>
    <div class="graph-workspace" id="graphWorkspace">
      <div class="graph-canvas" id="graphCanvas"></div>
      <div class="graph-search-panel" id="graphSearchPanel" hidden>
        <div class="graph-search-header">
          <input id="graphSearchInput" type="search" placeholder="搜索节点..." autocomplete="off" oninput="graphSearchInputChanged(this.value)" onkeydown="graphSearchKeydown(event)">
          <button class="graph-search-close" onclick="closeGraphSearchPanel()" title="关闭搜索" aria-label="关闭搜索">&times;</button>
        </div>
        <div class="graph-search-scope" id="graphSearchScope">
          <button class="graph-search-scope-btn active" data-scope="current" onclick="setGraphSearchScope('current', this)">当前图</button>
        </div>
        <div class="graph-search-results" id="graphSearchResults"></div>
      </div>
    </div>
    <div class="utopia-drop aurora-glass" id="utopiaDrop">
      <h2>把 .pmu 快照拖进来</h2>
      <p>PhyMath Utopia 快照是 PhyMathia 探索网的可交互产物：<br>
         节点里可以继续滚动看长回答（不受截图裁剪限制），画布可平移缩放，顶栏「会话」看完整对话。<br>
         想继续编辑？把快照文件拖回 PhyMathia 主页面即可恢复成可编辑的新画布。</p>
      <button class="utopia-btn primary" onclick="document.getElementById('utopiaFile').click()">选择文件</button>
      <p style="opacity:.75">快捷键：<b>F</b> 适配画布 · <b>/</b> 搜索 · 节点内直接滚动看长回答</p>
    </div>
  </div>
</div>
<div class="utopia-toast aurora-glass aurora-glass--compact" id="utopiaToast"></div>
<script src="/js/viewer.js?v=22846ba8"></script>
</body>
</html>
